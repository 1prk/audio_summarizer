services:
  postgres:
    image: postgres:15
    container_name: audio_summarizer_postgres
    environment:
      POSTGRES_DB: audio_summarizer
      POSTGRES_USER: audio_user
      POSTGRES_PASSWORD: audio_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audio_user -d audio_summarizer"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: audio_summarizer_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  flask:
    build:
      context: .
    container_name: audio_summarizer_flask
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - audio_data:/app/data
    environment:
      FLASK_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    command: ["python", "app.py"]

  worker:
    build:
      context: .
    volumes:
      - .:/app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    command: ["python", "workers/worker.py"]
    secrets:
      - openai_api_key

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/root/redis
      - ./data/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PORT=6379
      - REDIS_DATABASES=16
